# Docker Compose file for WishlistAPI (Vapor + Postgres)
#
# Start database only (recommended for local dev):
#   docker compose up -d db
#
# Run the API locally with swift run (outside docker) using these env vars:
#   DATABASE_HOST=localhost
#   DATABASE_PORT=5432
#   DATABASE_NAME=wishlist_dev
#   DATABASE_USERNAME=wishlist
#   DATABASE_PASSWORD=wishlist
#   JWT_SECRET=dev-only-change-me
#
# Or run the whole stack in Docker:
#   docker compose up -d app
#
# Run migrations in Docker:
#   docker compose run --rm migrate
#

volumes:
  db_data:

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_NAME: &db_name wishlist_dev
  DATABASE_USERNAME: &db_username wishlist
  DATABASE_PASSWORD: &db_password wishlist
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}

services:
  app:
    image: wishlistapi:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    ports:
      - "8080:8080"
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]

  migrate:
    image: wishlistapi:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0

  revert:
    image: wishlistapi:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0

  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: *db_username
      POSTGRES_PASSWORD: *db_password
      POSTGRES_DB: *db_name
    ports:
      - "5432:5432"
